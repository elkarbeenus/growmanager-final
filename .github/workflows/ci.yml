name: CI (Typecheck, Lint, Web-Build)

# Schneller Check ohne Tauri/Rust: läuft bei Pushes auf Branches (nicht bei Tags)
# und lädt das gebaute Web-Frontend (dist/) als Artefakt hoch.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "!ci-preview"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node-Pakete installieren
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Web-Build
        run: npm run build

      # Gebautes Frontend als Vorschau auf einen Hilfs-Branch legen (zum Testen ohne lokales npm)
      - name: dist auf Branch ci-preview legen
        run: |
          cd dist
          git init -q -b ci-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "preview ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-preview
