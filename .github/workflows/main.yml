name: 'Build Linux AppImage & Windows EXE'

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1 # nacheinander bauen, damit beide Builds sauber an dasselbe Release angehängt werden
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: '--bundles nsis' # Windows: Setup-.exe (NSIS)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (required for Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Tauri Build
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.1.1
          releaseName: 'Grow Manager v1.1.1'
          releaseBody: 'Automatisierter Build: Linux AppImage und Windows Setup (.exe).'
          tauriScript: 'npx tauri'
          args: ${{ matrix.args }}
