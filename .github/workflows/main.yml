name: Build AppImage
 
# Läuft NICHT bei jedem Push (spart Minuten), sondern:
#  - per Knopfdruck (Actions-Tab -> "Run workflow")
#  - wenn du einen Versions-Tag pushst, z.B. v1.2.0
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
 
# Wenn ein neuer Build startet, wird ein noch laufender alter abgebrochen
concurrency:
  group: build-appimage
  cancel-in-progress: true

# Nötig, damit der Workflow Releases anlegen und das AppImage anhängen darf
permissions:
  contents: write
 
jobs:
  build-linux:
    # Ubuntu 22.04 = ältere glibc -> AppImage läuft auch auf SteamOS
    runs-on: ubuntu-22.04
    timeout-minutes: 45
 
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
 
      - name: System-Abhängigkeiten für Tauri installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            file
 
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
 
      - name: Rust-Build-Cache (macht spätere Builds viel schneller)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
 
      - name: Node-Pakete installieren
        run: npm install
 
      - name: AppImage bauen
        run: npx tauri build --bundles appimage
 
      - name: AppImage hochladen
        uses: actions/upload-artifact@v4
        with:
          name: grow-app-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          # Nach 7 Tagen automatisch löschen -> Speicher läuft nicht wieder voll
          retention-days: 7
          if-no-files-found: error

      # Nur bei Versions-Tags (v1.9.0 …): öffentliches GitHub-Release mit AppImage erstellen.
      # Die App prüft beim Start genau dieses „neueste Release“ und zeigt dann den Update-Hinweis.
      - name: Patchnotes aus CHANGELOG.md holen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Abschnitt "## vX.Y.Z" bis zum nächsten "## " ausschneiden
          awk -v v="## v${VERSION}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Version ${VERSION}" > release-notes.md; fi
          cat release-notes.md

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: growmanager ${{ github.ref_name }}
          body_path: release-notes.md
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
 
